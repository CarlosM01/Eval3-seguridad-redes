server {
    listen 443 ssl;
    server_name as2.empresa.local;
    ssl_certificate     /etc/b2b/b2b.pem;
    ssl_certificate_key /etc/b2b/b2b.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/b2b-access.log;
    root /var/www/b2b;

    location / { index index.html; }
    # Only internal service the DMZ may reach (R-05B): WMS on TCP 8069.
    location /wms/ { proxy_pass http://192.168.20.5:8069/; proxy_connect_timeout 5s; }
}
server {
    listen 80;
    return 301 https://$host$request_uri;
}
