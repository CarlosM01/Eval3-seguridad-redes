# Publishes only public PKI objects: CA certificates, CRLs, issued certificates.
server.document-root = "/var/www/pki"
server.port          = 80
server.username      = "lighttpd"
server.groupname     = "lighttpd"
server.errorlog      = "/var/log/lighttpd/error.log"
server.modules       = ("mod_accesslog", "mod_proxy")
accesslog.filename   = "/var/log/lighttpd/access.log"
server.tag           = ""
mimetype.assign      = (
  ".crl" => "application/pkix-crl",
  ".pem" => "application/x-pem-file",
)

# OCSP (TCP 2560). openssl ocsp serves one connection at a time and hangs on
# an idle or empty one, so lighttpd takes the client connections and hands
# only complete requests to the responder on 127.0.0.1:2561.
$SERVER["socket"] == ":2560" {
  proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 2561 ) ) )
}
